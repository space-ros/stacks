name: MoveIt2 Docker build
on:
  workflow_call:
    inputs:
      run_build:
        description: "True if anything in the MoveIt2 directory changed"
        type: boolean
        required: true

jobs:
  space-ros-moveit2:
    if: ${{ inputs.run_build == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "ubuntu-24.04"
            arch: "amd64"
          - runner: "ubuntu-24.04-arm"
            arch: "arm64"
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_TAG: "${{ github.head_ref || github.ref_name }}"
      GHCR_IMAGE_NAME: "ghcr.io/space-ros/space-ros-moveit2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sanitize image tag
        run: echo "IMAGE_TAG=${IMAGE_TAG//\//-}" >> "$GITHUB_ENV"

      # Push each architecture to GHCR so the combine job can merge them
      - name: Login to GHCR
        uses: docker/login-action@v4
        if: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image and push main and tagged builds to GHCR
        uses: docker/build-push-action@v6
        with:
          context: moveit2
          push: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}

  combine-space-ros-moveit2-manifests:
    needs: space-ros-moveit2
    if: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: "${{ github.head_ref || github.ref_name }}"
      GHCR_IMAGE_NAME: "ghcr.io/space-ros/space-ros-moveit2"
      DOCKER_HUB_USERNAME: osrfbot
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
      DOCKER_HUB_IMAGE_NAME: "osrf/space-ros-moveit2"

    steps:
      - name: Sanitize image tag
        run: echo "IMAGE_TAG=${IMAGE_TAG//\//-}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the main moveit2 image to GHCR
        if: ${{ github.ref_name == 'main' }}
        run: |
          docker buildx imagetools create \
            --tag "$GHCR_IMAGE_NAME:$IMAGE_TAG" \
            "$GHCR_IMAGE_NAME:$IMAGE_TAG-amd64" \
            "$GHCR_IMAGE_NAME:$IMAGE_TAG-arm64"

      # Push both tagged releases and the latest main builds to Dockerhub
      - name: Push moveit2 images to Dockerhub
        run: |
          # We must login using the password and not the action, as the action only supports tokens.
          echo "$DOCKER_HUB_TOKEN" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
          docker buildx imagetools create \
            --tag "$DOCKER_HUB_IMAGE_NAME:$IMAGE_TAG" \
            "$GHCR_IMAGE_NAME:$IMAGE_TAG-amd64" \
            "$GHCR_IMAGE_NAME:$IMAGE_TAG-arm64"

      # Any tagged image should also be marked as "latest"
      - name: Push moveit2 latest images to Dockerhub
        if: ${{ github.ref_type == 'tag' }}
        run: |
          # We must login using the password and not the action, as the action only supports tokens.
          echo "$DOCKER_HUB_TOKEN" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
          docker buildx imagetools create \
            --tag "$DOCKER_HUB_IMAGE_NAME:latest" \
            "$DOCKER_HUB_IMAGE_NAME:$IMAGE_TAG"
